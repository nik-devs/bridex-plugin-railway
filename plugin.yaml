# railway — Railway for Bridex agents, through the official Railway CLI.
# kind MUST stay "integration": the plugin reads the agent's workspace to upload
# a folder, watches deploys in the background and wakes the agent when one
# settles — in-process facilities a catalog "tool" plugin does not get.
name: railway
title: Railway
version: 0.2.0
kind: integration
description: Railway for agents — projects, services and databases, deploys of a workspace folder that wake the agent when they settle, logs, variables, domains, redeploy and restart. The token stays in the plugin; agents never see it.
agent_notes: Every call runs the Railway CLI (bundled, pinned) with the instance's Railway token in a private HOME — no token in the agents' environment, no `railway login`. Deploys upload the folder (.gitignore respected), then the plugin follows the deployment and wakes the agent in its conversation when it settles, with the tail of the logs on failure.
entry: index.mjs
requires_env:
  - RAILWAY_API_TOKEN   # managed credential: Settings → Integrations → Railway (an account or workspace token)
